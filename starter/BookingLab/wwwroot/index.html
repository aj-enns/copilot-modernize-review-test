<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking Lab</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    body { font: 1.1rem "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      max-width: 40rem; margin: 3rem auto; padding: 1rem;
      background: var(--cp-bg); color: var(--cp-text); }
    label { display: block; margin: 1rem 0; }
    input, button { font: inherit; padding: .5rem; border-radius: .625rem;
      border: 1px solid var(--cp-border-strong); }
    input { background: var(--cp-surface); color: var(--cp-text); width: 5rem; }
    button { background: var(--cp-accent); color: var(--cp-accent-fg); cursor: pointer; }
    button:hover { background: var(--cp-accent-hover); }
    output { display: block; margin-top: 1rem; font-weight: 600; }
    #error { color: var(--cp-danger); }
  </style>
</head>
<body>
  <h1>Booking estimator</h1>
  <p>USD 100 per night plus USD 10 per guest per night.
    Stays of 7 or more nights receive 10% off the entire subtotal.</p>
  <form id="quote">
    <label>Nights <input id="nights" type="number" min="1" max="30" value="1" required></label>
    <label>Guests <input id="guests" type="number" min="1" max="6" value="1" required></label>
    <button type="submit">Calculate quote</button>
  </form>
  <output id="result" aria-live="polite"></output>
  <p id="error" role="alert"></p>
  <script>
    const form = document.querySelector('#quote');
    const result = document.querySelector('#result');
    const error = document.querySelector('#error');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      result.textContent = '';
      error.textContent = '';
      try {
        const response = await fetch('/api/quote', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nights: Number(document.querySelector('#nights').value),
            guests: Number(document.querySelector('#guests').value)
          })
        });
        const data = await response.json();
        if (!response.ok) {
          error.textContent = data.errors
            ? Object.values(data.errors).flat().join(' ')
            : 'Unable to calculate quote. Check your inputs and try again.';
          return;
        }
        result.textContent = `Total: ${new Intl.NumberFormat('en-US', {
          style: 'currency', currency: 'USD'
        }).format(data.total)}`;
      } catch {
        error.textContent = 'Unable to reach the server. Please try again.';
      }
    });
  </script>
</body>
</html>
